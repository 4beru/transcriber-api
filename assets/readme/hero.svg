<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" role="img" aria-labelledby="title desc">
  <title id="title">VAD Transcriber API Hero Architecture</title>
  <desc id="desc">High-Performance Real-Time Speech Recognition and Speaker Verification System Architecture</desc>
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a11"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-gradient)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Decorative Grid Dots -->
  <g fill="#374151" opacity="0.15">
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/><circle cx="160" cy="80" r="1.5"/>
    <circle cx="40" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="160" cy="120" r="1.5"/>
    <circle cx="1040" cy="300" r="1.5"/><circle cx="1080" cy="300" r="1.5"/><circle cx="1120" cy="300" r="1.5"/><circle cx="1160" cy="300" r="1.5"/>
    <circle cx="1040" cy="340" r="1.5"/><circle cx="1080" cy="340" r="1.5"/><circle cx="1120" cy="340" r="1.5"/><circle cx="1160" cy="340" r="1.5"/>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(56, 50)">
    <!-- Category Eyebrow -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0e7490" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">SPEECH &amp; AI INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">transcriber-api</text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#9ca3af">High-Performance Real-Time ASR &amp; Speaker ID</text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#6b7280">Sherpa-ONNX • Dual VAD (TEN/Silero) • WebSocket Streaming</text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 165)">
      <!-- Badge 1: Go 1.24 -->
      <rect x="0" y="0" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="14" cy="14" r="4" fill="#00add8"/>
      <text x="26" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#e2e8f0">Go 1.24+</text>

      <!-- Badge 2: Dual VAD -->
      <rect x="107" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="121" cy="14" r="4" fill="#10b981"/>
      <text x="133" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#e2e8f0">Dual VAD</text>

      <!-- Badge 3: Cgo / ONNX -->
      <rect x="224" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="238" cy="14" r="4" fill="#f59e0b"/>
      <text x="250" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#e2e8f0">Cgo / ONNX</text>
    </g>

    <!-- Key Metrics Card -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="460" height="65" rx="10" fill="url(#card-bg)" stroke="#374151" stroke-width="1"/>

      <!-- Metric 1 -->
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9ca3af">LATENCY</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">&lt; 50 ms</text>

      <!-- Divider -->
      <line x1="140" y1="15" x2="140" y2="50" stroke="#374151" stroke-width="1"/>

      <!-- Metric 2 -->
      <text x="160" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9ca3af">VAD CAPACITY</text>
      <text x="160" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#34d399">200 Pools</text>

      <!-- Divider -->
      <line x1="300" y1="15" x2="300" y2="50" stroke="#374151" stroke-width="1"/>

      <!-- Metric 3 -->
      <text x="320" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9ca3af">CONCURRENCY</text>
      <text x="320" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#fbbf24">500+ Conn</text>
    </g>
  </g>

  <!-- Right Visual Material: Streaming Audio Pipeline Card -->
  <g transform="translate(560, 45)">
    <!-- Container Card -->
    <rect x="0" y="0" width="580" height="290" rx="14" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="580" height="36" rx="14" fill="#1f2937" fill-opacity="0.6"/>

    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5.5" fill="#10b981"/>
    <text x="75" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ca3af">realtime_audio_pipeline.go</text>

    <!-- Pipeline Step 1: Audio Input & Waveform -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="540" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
      <text x="15" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#06b6d4">INPUT STREAM</text>
      <text x="15" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">PCM 16kHz Mono (Chunk: 4096B)</text>

      <!-- Simulated Audio Waveform Bars -->
      <g transform="translate(360, 15)" fill="url(#accent-cyan)">
        <rect x="0" y="8" width="3" height="12" rx="1.5"/>
        <rect x="6" y="2" width="3" height="24" rx="1.5"/>
        <rect x="12" y="10" width="3" height="8" rx="1.5"/>
        <rect x="18" y="0" width="3" height="28" rx="1.5"/>
        <rect x="24" y="5" width="3" height="18" rx="1.5"/>
        <rect x="30" y="12" width="3" height="4" rx="1.5"/>
        <rect x="36" y="2" width="3" height="24" rx="1.5"/>
        <rect x="42" y="7" width="3" height="14" rx="1.5"/>
        <rect x="48" y="1" width="3" height="26" rx="1.5"/>
        <rect x="54" y="9" width="3" height="10" rx="1.5"/>
        <rect x="60" y="3" width="3" height="22" rx="1.5"/>
        <rect x="66" y="11" width="3" height="6" rx="1.5"/>
        <rect x="72" y="0" width="3" height="28" rx="1.5"/>
        <rect x="78" y="6" width="3" height="16" rx="1.5"/>
        <rect x="84" y="12" width="3" height="4" rx="1.5"/>
        <rect x="90" y="4" width="3" height="20" rx="1.5"/>

        <!-- Active Wave Indicator -->
        <circle cx="120" cy="14" r="4" fill="#10b981" filter="url(#glow)"/>
        <text x="132" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#34d399">LIVE</text>
      </g>
    </g>

    <!-- Arrow Down -->
    <path d="M 290 112 L 290 120" stroke="#4b5563" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Pipeline Step 2: Dual VAD Processing -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="540" height="52" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155"/>
      <text x="15" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#10b981">VAD ENGINE POOL</text>
      <text x="15" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e2e8f0">TEN-VAD (Cgo) / Silero-VAD (ONNX)</text>

      <rect x="360" y="14" width="160" height="24" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
      <text x="372" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6ee7b7">Speech Segment Cut</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 290 182 L 290 190" stroke="#4b5563" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Pipeline Step 3: ASR & Speaker Recognition Output -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="540" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="15" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#3b82f6">RECOGNITION DECODER &amp; SPEAKER ID</text>

      <!-- ASR Text Result -->
      <text x="15" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Text: &quot;欢迎使用 VAD ASR 高性能语音识别服务器！&quot;</text>
      <text x="15" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9ca3af">Speaker: &quot;User_001&quot; • Confidence: 94.8% • Model: SenseVoice</text>

      <!-- Success Check Circle -->
      <circle cx="510" cy="38" r="12" fill="#047857"/>
      <path d="M 504 38 L 508 42 L 516 34" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
